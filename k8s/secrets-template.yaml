# Kubernetes Secrets Template
# DO NOT commit actual secrets to version control
# Create secrets using: kubectl create secret generic echoverse-secrets --from-literal=key=value

apiVersion: v1
kind: Secret
metadata:
  name: echoverse-secrets
  namespace: echoverse
type: Opaque
stringData:
  # Generate with: openssl rand -base64 32
  database-url: "postgresql://user:password@host:5432/database"
  session-secret: "REPLACE_WITH_32_CHAR_SECRET"
  jwt-secret: "REPLACE_WITH_32_CHAR_SECRET"
  2fa-encryption-key: "REPLACE_WITH_32_CHAR_SECRET"
  webhook-secret: "REPLACE_WITH_32_CHAR_SECRET"
  
  # External service keys
  openai-api-key: "sk-REPLACE_WITH_OPENAI_KEY"
  stripe-secret-key: "sk_live_REPLACE_WITH_STRIPE_KEY"
  stripe-webhook-secret: "whsec_REPLACE_WITH_STRIPE_WEBHOOK_SECRET"

---
# Create secrets via kubectl command (recommended):
# kubectl create secret generic echoverse-secrets \
#   --from-literal=database-url="postgresql://..." \
#   --from-literal=session-secret="$(openssl rand -base64 32)" \
#   --from-literal=jwt-secret="$(openssl rand -base64 32)" \
#   --from-literal=2fa-encryption-key="$(openssl rand -base64 32)" \
#   --from-literal=webhook-secret="$(openssl rand -base64 32)" \
#   --from-literal=openai-api-key="sk-..." \
#   --from-literal=stripe-secret-key="sk_live_..." \
#   --from-literal=stripe-webhook-secret="whsec_..." \
#   --namespace=echoverse
